# Yorumdan hattı — Mac kapalıyken de çalışır (2026-11-27).
# Saatler UTC (Türkiye = UTC+3). GitHub zamanlaması 5-30 dk gecikebilir; hattın "bugün zaten paylaşıldı" kapısı çift paylaşımı önler.
#  09:15 UTC = 12:15  Kartvizitçi          (@kartvizitci.tr)
#  09:30 UTC = 12:30  Cüzdan Hocası · Yılda Kaça Patlıyor?
#  14:30 UTC = 17:30  Cüzdan Hocası · Maaş Kapışması
#  16:15 UTC = 19:15  Siteci Abi (@siteci.abi) — site Site Mucidi çekirdek kopyasıyla üretilir (özel depo mcht54/site-mucidi-motor)
#  17:30 UTC = 20:30  Cüzdan Hocası · Bütçe Kliniği
# Kayıtlar özel depoda (mcht54/yorumdan-durum). Panel senkronu ayrı iş akışında (panel.yml, 15 dk).
name: gunluk
on:
  schedule:
    - cron: "15 9 * * *"
    - cron: "30 9 * * *"
    - cron: "30 14 * * *"
    - cron: "30 17 * * *"
    - cron: "15 16 * * *"
  workflow_dispatch:
    inputs:
      hesap: {description: "kartvizit | web | para", default: "para"}
      bicim: {description: "butce | aliskanlik | kapisma (yalnız para)", default: "butce"}
      deneme: {description: "true = paylaşmadan dene", default: "true"}
permissions:
  contents: read
jobs:
  bolum:
    # 2026-11-27: GitHub cron güvenilmez (12:15/12:30 hiç çalışmadı). Saatleri sunucu tetikler (VDS mcht-tetik-yorumdan, workflow_dispatch).
    # Depo değişkeni VDS_TETIK=1 iken GitHub'ın kendi (gecikmeli) zamanlaması atlanır: sırada bekleyen işi iptal edemesin.
    if: github.event_name != 'schedule' || vars.VDS_TETIK != '1'
    concurrency:
      group: yorumdan-durum      # aynı anda tek çalışma: durum deposunda çakışma olmasın (atlanan iş gruba girmez)
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60   # Kartvizitçi 3B render ekran kartı olmadan ~25 dk
    env:
      YORUMDAN_SESSIZ: "1"          # açık depo: günlük satırları Actions kaydına yazılmaz, yalnız özel durum deposuna
      YORUMDAN_KAYNAK: "actions"
      HYPERFRAMES_NO_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      HYPERFRAMES_CLI: ${{ github.workspace }}/.arac/node_modules/.bin/hyperframes
      TZ: Europe/Istanbul
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
      GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
      GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
      GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
      GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      IG_PARA_ID: ${{ secrets.IG_PARA_ID }}
      IG_PARA_API: ${{ secrets.IG_PARA_API }}
      IG_PARA_TOKEN: ${{ secrets.IG_PARA_TOKEN }}
      META_PARA_PAGE_ID: ${{ secrets.META_PARA_PAGE_ID }}
      IG_KARTVIZIT_ID: ${{ secrets.IG_KARTVIZIT_ID }}
      IG_KARTVIZIT_API: ${{ secrets.IG_KARTVIZIT_API }}
      IG_KARTVIZIT_TOKEN: ${{ secrets.IG_KARTVIZIT_TOKEN }}
      META_KARTVIZIT_PAGE_ID: ${{ secrets.META_KARTVIZIT_PAGE_ID }}
      IG_WEB_ID: ${{ secrets.IG_WEB_ID }}
      IG_WEB_API: ${{ secrets.IG_WEB_API }}
      IG_WEB_TOKEN: ${{ secrets.IG_WEB_TOKEN }}
      META_WEB_PAGE_ID: ${{ secrets.META_WEB_PAGE_ID }}
      SITE_MUCIDI: ${{ github.workspace }}/.sm
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - name: Hangi bölüm
        id: is
        run: |
          case "${{ github.event.schedule }}" in
            "15 9 * * *")  echo "arg=--hesap kartvizit" >> $GITHUB_OUTPUT ;;
            "30 9 * * *")  echo "arg=--hesap para --bicim aliskanlik" >> $GITHUB_OUTPUT ;;
            "30 14 * * *") echo "arg=--hesap para --bicim kapisma" >> $GITHUB_OUTPUT ;;
            "30 17 * * *") echo "arg=--hesap para --bicim butce" >> $GITHUB_OUTPUT ;;
            "15 16 * * *") echo "arg=--hesap web" >> $GITHUB_OUTPUT ;;
            *) a="--hesap ${{ inputs.hesap }}"; [ "${{ inputs.hesap }}" = "para" ] && a="$a --bicim ${{ inputs.bicim }}"
               [ "${{ inputs.deneme }}" = "true" ] && a="$a --deneme"; echo "arg=$a" >> $GITHUB_OUTPUT ;;
          esac
      - uses: actions/checkout@v4
      - name: Durum deposu (özel)
        uses: actions/checkout@v4
        with:
          repository: mcht54/yorumdan-durum
          ssh-key: ${{ secrets.DURUM_DEPLOY_KEY }}
          path: durum
      - name: Site Mucidi çekirdeği (yalnız Siteci Abi)
        if: contains(steps.is.outputs.arg, '--hesap web')
        uses: actions/checkout@v4
        with:
          repository: mcht54/site-mucidi-motor
          ssh-key: ${{ secrets.MOTOR_DEPLOY_KEY }}
          path: .sm
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Önbellek (Chrome, Whisper modeli, hyperframes)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/hyperframes
            ~/.cache/huggingface
            .arac/node_modules
            ~/.cache/ms-playwright
          key: yorumdan-arac-v2-hf0.9.80-whisper-small-pw
      - name: Kurulum
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji > /dev/null
          pip install -q -r requirements.txt
          mkdir -p .arac && cd .arac && [ -x node_modules/.bin/hyperframes ] || npm install -s --no-audit --no-fund hyperframes@0.9.80
          cd .. && printf '%s' "${{ secrets.PANEL_ANAHTARI }}" > hat/.panel_anahtari && chmod 600 hat/.panel_anahtari
          if [ -d .sm ]; then cd .sm && npm install -s --no-audit --no-fund && npx playwright install --with-deps chromium > /dev/null && cd ..; fi
      - name: Bölüm üret ve paylaş
        run: |
          python hat/gunluk.py ${{ steps.is.outputs.arg }} > /dev/null 2> durum/actions-son-hata.log || echo "hat hata kodu verdi, ayrıntı özel durum deposunda"
      - name: Durum kaydet (özel depo)
        if: always()
        run: |
          cd durum && git add -A && git -c user.name=yorumdan-hat -c user.email=yorumdan-hat@users.noreply.github.com commit -qm "actions hata kaydı" || true
          for i in 1 2 3; do git push -q && break; git pull --rebase -q || { git rebase --abort; git -c user.name=yorumdan-hat -c user.email=yorumdan-hat@users.noreply.github.com pull --no-rebase -X ours --no-edit -q; }; done
      - name: Sonuç (yalnız durum, kişisel veri yok)
        if: always()
        run: |
          tail -n 40 durum/gunluk.log | grep -E "(para|kartvizit)[^ ]*: (sonuç|HATA|kalite|GÜVENLİK|DENEME|bugün zaten)" | sed -E 's/"kullanici": "[^"]*"/"kullanici": "…"/g; s/@[A-Za-z0-9._]+/@…/g' | cut -c1-220 || true
